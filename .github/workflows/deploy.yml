name: Deploy

run-name: Deploy ${{ github.event.workflow_run.head_branch }} site

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [CI]
    types: [completed]
  
jobs: 
  build-and-deploy:
    name: Publish main to GH pages
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.url }}
    permissions: 
      contents: write
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
      - name: Build
        run: bundle exec rake build
      - name: Publish main site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build

  pr-preview:
    name: Publish preview to GH pages
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    environment:
      name: github-pages-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      url: ${{ steps.pages.outputs.url }}previews/pr-${{ github.event.workflow_run.pull_requests[0].number }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - name: Get Pages URL
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "url=$(gh api repos/${{ github.repository }}/pages --jq .html_url)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
      - name: Build
        run: bundle exec rake build
      - name: Publish preview site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          destination_dir: previews/pr-${{ github.event.workflow_run.pull_requests[0].number }}